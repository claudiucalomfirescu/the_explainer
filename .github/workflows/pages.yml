# Builds the AI History Timeline (timeline/) and publishes it to GitHub Pages (REQ-18, ADR-001).
# The base path and the site address come from GitHub itself (configure-pages), so the same file
# works for a project site (/ai-history-timeline/), a user site or a custom domain.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "timeline/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: timeline
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from timeline/package.json "packageManager"
        with:
          package_json_file: timeline/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: timeline/pnpm-lock.yaml
      - id: pages
        uses: actions/configure-pages@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
      # Without .nojekyll, GitHub Pages hides folders that start with "_", such as _next/.
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: timeline/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
