<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Transformer Mechanism</title>
<style>
  :root {
    --bg: #05070b; --panel: #0a0e15; --line: #1c2533; --text: #e8eefc; --muted: #8a97ad;
    --amber: #ffb347; --q: #ffc23a; --k: #38d6ff; --v: #ff4fc0; --g: #7cffb2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: "Inter", "SF Pro Display", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #app { display: grid; grid-template-rows: 1fr auto; height: 100vh; }
  #stage { position: relative; min-height: 0; overflow: hidden; }
  #stage canvas { display: block; }
  #brand { position: absolute; top: 18px; left: 22px; font: 600 12px/1 "JetBrains Mono", "SF Mono", Menlo, monospace;
    letter-spacing: .22em; color: var(--muted); text-transform: uppercase; pointer-events: none; }
  #brand b { color: var(--amber); font-weight: 700; }
  #stage::after { content: ""; position: absolute; inset: auto 0 0 0; height: 90px; pointer-events: none;
    background: linear-gradient(to bottom, transparent, var(--panel)); }

  #panel { position: relative; background: var(--panel); border-top: 1px solid var(--line);
    padding: 18px clamp(16px, 5vw, 72px) 18px; height: clamp(170px, 25vh, 260px); display: grid; grid-template-rows: 1fr auto; gap: 12px; }
  #caption { max-width: 1100px; margin: 0 auto; width: 100%; will-change: opacity, transform; }
  #step { font: 700 12px/1 "JetBrains Mono", "SF Mono", Menlo, monospace; letter-spacing: .2em; color: var(--amber); margin-bottom: 10px; }
  #title { font-size: clamp(20px, 2.3vw, 34px); font-weight: 750; letter-spacing: -.01em; margin-bottom: 8px; }
  #body { font-size: clamp(14px, 1.35vw, 20px); line-height: 1.5; color: #c4cee0; max-width: 72ch; }
  #body b { font-weight: 650; }
  #body .q { color: var(--q); } #body .k { color: var(--k); } #body .v { color: var(--v); }
  #body .a { color: var(--amber); } #body .g { color: var(--g); }

  #controls { max-width: 1100px; margin: 0 auto; width: 100%; display: flex; align-items: center; gap: 14px; }
  #play { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: #111723; color: var(--text);
    cursor: pointer; font-size: 12px; flex: none; }
  #play:hover { border-color: var(--amber); }
  #bar { position: relative; flex: 1; height: 22px; cursor: pointer; }
  #bar::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 3px; background: var(--line); border-radius: 2px; }
  #fill { position: absolute; left: 0; top: 10px; height: 3px; background: var(--amber); border-radius: 2px; }
  #ticks i { position: absolute; top: 7px; width: 2px; height: 9px; background: #3a4558; }
  #clock { font: 500 12px "JetBrains Mono", "SF Mono", Menlo, monospace; color: var(--muted); flex: none; min-width: 84px; text-align: right; }
  #chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font: 600 11px/1 "JetBrains Mono", "SF Mono", Menlo, monospace; letter-spacing: .06em; color: var(--muted);
    background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 9px; cursor: pointer; }
  .chip.on { color: #111; background: var(--amber); border-color: var(--amber); }
  #chipsRow { max-width: 1100px; margin: 0 auto; width: 100%; }

  body.capture #controls, body.capture #chipsRow { display: none; }
  body.capture #panel { grid-template-rows: 1fr; }
  @media (max-width: 720px) { #chipsRow { display: none; } #panel { height: auto; min-height: 200px; } }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><div id="brand"><b>Transformer</b> · how it works</div></div>
  <div id="panel">
    <div id="caption">
      <div id="step"></div>
      <div id="title"></div>
      <div id="body"></div>
    </div>
    <div>
      <div id="controls">
        <button id="play" aria-label="Play / pause">❚❚</button>
        <div id="bar"><div id="ticks"></div><div id="fill"></div></div>
        <div id="clock"></div>
      </div>
      <div id="chipsRow" style="margin-top:10px"><div id="chips"></div></div>
    </div>
  </div>
</div>
